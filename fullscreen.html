<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #imageContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        #generatedImage {
            width: 100vw;
            height: 100vh;
            object-fit: cover;  /* Täcker hela skärmen, croppar om nödvändigt */
            opacity: 0;
            transition: opacity 1s ease-in-out;
            position: absolute;
        }

        #generatedImageOld {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            position: absolute;
            pointer-events: none;
        }

        /* Alternative: object-fit: fill stretches the image to fill */
        #generatedImage.stretch {
            object-fit: fill;
        }

        /* Alternative: object-fit: contain shows full image with letterboxing */
        #generatedImage.contain {
            object-fit: contain;
        }

        #generatedImage.show {
            opacity: 1;
        }

        #loadingIndicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fff;
            opacity: 1;
            transition: opacity 0.5s;
        }

        #loadingIndicator.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 80px;
            height: 80px;
            border: 8px solid rgba(255, 255, 255, 0.1);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #promptText {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 1.2em;
            text-align: center;
            max-width: 80%;
            padding: 20px 40px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            backdrop-filter: blur(10px);
            opacity: 0;
            transition: opacity 0.5s;
        }

        #promptText.show {
            opacity: 1;
        }

        #controls {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            font-size: 14px;
            transition: all 0.3s;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        /* Fade in/out animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .fade-in {
            animation: fadeIn 1.5s ease-in-out;
        }
    </style>
</head>
<body>
    <div id="controls">
        <button class="control-btn" onclick="togglePrompt()">📝 Prompt</button>
        <button class="control-btn" onclick="clearImage()">🗑️ Rensa</button>
        <button class="control-btn" onclick="toggleFitMode()" id="fitModeBtn">🖼️ Cover</button>
    </div>

    <div id="loadingIndicator">
        <div class="spinner"></div>
        <p>Genererar bild...</p>
    </div>

    <div id="imageContainer">
        <img id="generatedImageOld" alt="Previous AI Generated Image">
        <img id="generatedImage" alt="AI Generated Image">
    </div>

    <div id="promptText"></div>

    <script>
        // Configuration
        const WS_URL = 'ws://localhost:8765';

        // BroadcastChannel for receiving images from main window
        const imageChannel = new BroadcastChannel('ai-agent-images');

        // State
        let ws = null;
        let currentPrompt = '';
        let promptVisible = false;
        let fitMode = 'cover'; // cover, contain, fill

        // DOM Elements
        const loadingIndicator = document.getElementById('loadingIndicator');
        const generatedImage = document.getElementById('generatedImage');
        const generatedImageOld = document.getElementById('generatedImageOld');
        const promptText = document.getElementById('promptText');

        // Listen for images from main window
        imageChannel.onmessage = (event) => {
            console.log('📡 Received image from main window:', event.data.source);
            if (event.data.type === 'image_generated') {
                displayImage(event.data.image, event.data.prompt);
            }
        };

        // Connect to WebSocket
        function connectWebSocket() {
            console.log('🔌 Connecting to WebSocket...');

            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                console.log('✅ WebSocket connected');
                loadingIndicator.querySelector('p').textContent = 'Ansluten. Väntar på bild...';
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    console.log('📨 Message received:', data.type);

                    if (data.type === 'image_generated') {
                        displayImage(data.image, data.prompt || data.enhanced_prompt);
                    } else if (data.type === 'status') {
                        updateStatus(data.message);
                    }
                } catch (error) {
                    console.error('❌ Error parsing message:', error);
                }
            };

            ws.onerror = (error) => {
                console.error('❌ WebSocket error:', error);
                loadingIndicator.querySelector('p').textContent = 'Anslutningsfel. Försöker igen...';
            };

            ws.onclose = () => {
                console.log('🔌 WebSocket disconnected. Reconnecting in 3s...');
                loadingIndicator.querySelector('p').textContent = 'Anslutning bruten. Återansluter...';
                setTimeout(connectWebSocket, 3000);
            };
        }

        // Display image with crossfade effect
        function displayImage(base64Image, prompt) {
            console.log('🎨 Displaying image with crossfade...');

            // Hide loading
            loadingIndicator.classList.add('hidden');

            // Step 1: If current image is showing, move it to old position and fade out
            if (generatedImage.classList.contains('show')) {
                generatedImageOld.src = generatedImage.src;
                generatedImageOld.style.objectFit = generatedImage.style.objectFit || 'cover';
                generatedImageOld.classList.add('show');

                // Fade out old image
                setTimeout(() => {
                    generatedImageOld.classList.remove('show');
                }, 50);
            }

            // Step 2: Fade out current image briefly
            generatedImage.classList.remove('show');

            // Step 3: Load new image and fade in after a brief delay
            setTimeout(() => {
                generatedImage.src = 'data:image/png;base64,' + base64Image;

                // Give browser time to load image
                generatedImage.onload = () => {
                    generatedImage.classList.add('show', 'fade-in');
                };
            }, 300);

            // Store prompt
            currentPrompt = prompt || 'En AI-genererad bild';
            promptText.textContent = currentPrompt;

            // Show prompt briefly
            setTimeout(() => {
                promptText.classList.add('show');
                promptVisible = true;

                // Auto-hide after 5 seconds
                setTimeout(() => {
                    if (promptVisible) {
                        promptText.classList.remove('show');
                        promptVisible = false;
                    }
                }, 5000);
            }, 1000);

            console.log('✅ Image displayed with crossfade');
        }

        // Update status message
        function updateStatus(message) {
            if (!generatedImage.classList.contains('show')) {
                loadingIndicator.querySelector('p').textContent = message;
            }
        }

        // Toggle prompt visibility
        function togglePrompt() {
            if (promptVisible) {
                promptText.classList.remove('show');
                promptVisible = false;
            } else {
                promptText.classList.add('show');
                promptVisible = true;
            }
        }

        // Clear image
        function clearImage() {
            generatedImage.classList.remove('show', 'fade-in');
            generatedImage.src = '';
            promptText.classList.remove('show');
            promptText.textContent = '';
            currentPrompt = '';
            promptVisible = false;
            loadingIndicator.classList.remove('hidden');
            loadingIndicator.querySelector('p').textContent = 'Väntar på bild...';
            console.log('🗑️ Image cleared');
        }

        // Toggle fit mode (cover, contain, fill)
        function toggleFitMode() {
            const modes = ['cover', 'contain', 'fill'];
            const currentIndex = modes.indexOf(fitMode);
            const nextIndex = (currentIndex + 1) % modes.length;
            fitMode = modes[nextIndex];

            // Remove all fit classes from both images
            generatedImage.classList.remove('cover', 'contain', 'stretch');
            generatedImageOld.classList.remove('cover', 'contain', 'stretch');

            // Apply new fit mode to both images
            if (fitMode === 'contain') {
                generatedImage.classList.add('contain');
                generatedImage.style.objectFit = 'contain';
                generatedImageOld.classList.add('contain');
                generatedImageOld.style.objectFit = 'contain';
                document.getElementById('fitModeBtn').textContent = '🖼️ Contain';
            } else if (fitMode === 'fill') {
                generatedImage.classList.add('stretch');
                generatedImage.style.objectFit = 'fill';
                generatedImageOld.classList.add('stretch');
                generatedImageOld.style.objectFit = 'fill';
                document.getElementById('fitModeBtn').textContent = '🖼️ Fill';
            } else {
                generatedImage.style.objectFit = 'cover';
                generatedImageOld.style.objectFit = 'cover';
                document.getElementById('fitModeBtn').textContent = '🖼️ Cover';
            }

            console.log('🖼️ Fit mode:', fitMode);
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'p' || e.key === 'P') {
                togglePrompt();
            } else if (e.key === 'c' || e.key === 'C') {
                clearImage();
            } else if (e.key === 'Escape') {
                promptText.classList.remove('show');
                promptVisible = false;
            }
        });

        // Initialize
        console.log('🚀 Starting fullscreen image viewer...');
        connectWebSocket();
    </script>
</body>
</html>
