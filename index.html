<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Voice-to-Image Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .status-bar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .status-indicator {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ff4444;
            animation: pulse 2s infinite;
        }

        .status-indicator.connected {
            background: #44ff44;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-text {
            flex: 1;
            font-size: 1.1em;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }

        button {
            padding: 15px 40px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        #startBtn {
            background: #44ff44;
            color: #000;
        }

        #startBtn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        #stopBtn {
            background: #ff4444;
            color: #fff;
        }

        #stopBtn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 1200px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            min-height: 400px;
        }

        .panel h2 {
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        #transcriptionText {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 20px;
            min-height: 150px;
            font-size: 1.3em;
            line-height: 1.6;
        }

        #promptText {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
            font-size: 1.1em;
            font-style: italic;
            color: #ffd700;
        }

        #imageContainer {
            position: relative;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #generatedImage {
            max-width: 100%;
            max-height: 600px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none;
        }

        .loading {
            text-align: center;
            font-size: 1.5em;
        }

        .spinner {
            border: 5px solid rgba(255,255,255,0.3);
            border-top: 5px solid #fff;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .image-info {
            margin-top: 15px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            font-size: 0.9em;
        }

        .recording {
            animation: recordingPulse 1.5s infinite;
        }

        @keyframes recordingPulse {
            0%, 100% {
                background: rgba(255, 68, 68, 0.1);
            }
            50% {
                background: rgba(255, 68, 68, 0.3);
            }
        }

        .error {
            background: rgba(255, 68, 68, 0.8);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎤 AI Agent Voice-to-Image</h1>
            <p class="subtitle">Prata och se dina ord bli till bilder i realtid</p>
        </header>

        <div class="status-bar">
            <div class="status-indicator" id="statusIndicator"></div>
            <div class="status-text" id="statusText">Ansluter...</div>
        </div>

        <div class="controls">
            <button id="startBtn" disabled>🎤 Starta Inspelning</button>
            <button id="stopBtn" disabled>⏹️ Stoppa</button>
        </div>

        <div class="main-content">
            <div class="panel">
                <h2>📝 Transkription</h2>
                <div id="transcriptionText">Väntar på din röst...</div>
                <div id="promptText" style="display: none;"></div>
            </div>

            <div class="panel">
                <h2>🎨 Genererad Bild</h2>
                <div id="imageContainer">
                    <div class="loading" id="loadingIndicator" style="display: none;">
                        <div class="spinner"></div>
                        <div>Genererar bild...</div>
                    </div>
                    <img id="generatedImage" alt="Genererad bild">
                </div>
                <div id="imageInfo" class="image-info" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const WS_URL = 'ws://localhost:8765';

        // State
        let ws = null;
        let audioContext = null;
        let mediaStream = null;
        let processor = null;
        let isRecording = false;

        // DOM Elements
        const statusIndicator = document.getElementById('statusIndicator');
        const statusText = document.getElementById('statusText');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const transcriptionText = document.getElementById('transcriptionText');
        const promptText = document.getElementById('promptText');
        const imageContainer = document.getElementById('imageContainer');
        const generatedImage = document.getElementById('generatedImage');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const imageInfo = document.getElementById('imageInfo');

        // WebSocket Connection
        function connectWebSocket() {
            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                console.log('✅ Ansluten till servern');
                statusIndicator.classList.add('connected');
                statusText.textContent = 'Ansluten - Redo att börja!';
                startBtn.disabled = false;
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleServerMessage(data);
            };

            ws.onerror = (error) => {
                console.error('❌ WebSocket fel:', error);
                statusText.textContent = 'Fel vid anslutning';
            };

            ws.onclose = () => {
                console.log('🔌 Frånkopplad från servern');
                statusIndicator.classList.remove('connected');
                statusText.textContent = 'Frånkopplad - försöker återansluta...';
                startBtn.disabled = true;
                stopBtn.disabled = true;

                // Reconnect after 3 seconds
                setTimeout(connectWebSocket, 3000);
            };
        }

        // Handle messages from server
        function handleServerMessage(data) {
            console.log('📨 Meddelande från server:', data);

            switch(data.type) {
                case 'connected':
                    statusText.textContent = data.message;
                    break;

                case 'transcription':
                    transcriptionText.textContent = data.text;
                    transcriptionText.parentElement.classList.add('recording');
                    break;

                case 'processing':
                    transcriptionText.parentElement.classList.remove('recording');
                    statusText.textContent = '🤖 Processar: ' + data.sentence;
                    loadingIndicator.style.display = 'block';
                    generatedImage.style.display = 'none';
                    break;

                case 'prompt_enhanced':
                    promptText.textContent = '💡 Bildprompt: ' + data.enhanced;
                    promptText.style.display = 'block';
                    break;

                case 'image_generated':
                    loadingIndicator.style.display = 'none';
                    generatedImage.src = 'data:image/png;base64,' + data.image;
                    generatedImage.style.display = 'block';

                    imageInfo.innerHTML = `
                        <strong>Original text:</strong> ${data.original_text}<br>
                        <strong>Prompt:</strong> ${data.prompt}
                    `;
                    imageInfo.style.display = 'block';

                    statusText.textContent = '✅ Bild genererad! Fortsätt prata...';
                    break;

                case 'error':
                    loadingIndicator.style.display = 'none';
                    statusText.innerHTML = `<span class="error">❌ Fel: ${data.message}</span>`;
                    break;
            }
        }

        // Start Recording
        async function startRecording() {
            try {
                // Get microphone access
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        channelCount: 1,
                        sampleRate: 16000,
                        echoCancellation: true,
                        noiseSuppression: true
                    }
                });

                // Create audio context
                audioContext = new (window.AudioContext || window.webkitAudioContext)({
                    sampleRate: 16000
                });

                const source = audioContext.createMediaStreamSource(mediaStream);
                processor = audioContext.createScriptProcessor(4096, 1, 1);

                processor.onaudioprocess = (e) => {
                    if (isRecording && ws.readyState === WebSocket.OPEN) {
                        const inputData = e.inputBuffer.getChannelData(0);
                        const int16Data = new Int16Array(inputData.length);

                        // Convert float32 to int16
                        for (let i = 0; i < inputData.length; i++) {
                            int16Data[i] = Math.max(-32768, Math.min(32767, inputData[i] * 32768));
                        }

                        ws.send(int16Data.buffer);
                    }
                };

                source.connect(processor);
                processor.connect(audioContext.destination);

                isRecording = true;
                startBtn.disabled = true;
                stopBtn.disabled = false;
                statusText.textContent = '🎤 Lyssnar... Börja prata!';
                transcriptionText.textContent = '';

                console.log('🎤 Inspelning startad');

            } catch (error) {
                console.error('❌ Kunde inte starta inspelning:', error);
                alert('Kunde inte få tillgång till mikrofonen. Kontrollera behörigheter.');
            }
        }

        // Stop Recording
        function stopRecording() {
            isRecording = false;

            if (processor) {
                processor.disconnect();
                processor = null;
            }

            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }

            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }

            startBtn.disabled = false;
            stopBtn.disabled = true;
            statusText.textContent = 'Ansluten - Redo att börja!';

            console.log('⏹️ Inspelning stoppad');
        }

        // Event Listeners
        startBtn.addEventListener('click', startRecording);
        stopBtn.addEventListener('click', stopRecording);

        // Initialize
        connectWebSocket();
    </script>
</body>
</html>
